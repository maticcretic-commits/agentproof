# AgentForge family dogfood: this repo verifies itself with the
# shared reusable workflow (maticcretic-commits/.github) — AgentProof checks this working tree (git evidence + criteria) on every push.
# Reports are uploaded as run artifacts; a FAIL verdict fails the job.

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: maticcretic-commits/.github/.github/workflows/agentforge-verify.yml@main
    with:
      tool: agentproof
      args: check --format json
